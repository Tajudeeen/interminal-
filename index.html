<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.vercel-insights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src https://fonts.gstatic.com; connect-src 'self' https://rpc.mainnet.arc.io https://api.dexscreener.com https://vitals.vercel-insights.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>INTERMINAL — Autonomous Corporate Treasury & Liquidity Desk (Arc Mainnet)</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Persist theme before paint to avoid flash
    (function() {
      const t = localStorage.getItem("interminal_theme") || "dark";
      document.documentElement.classList.toggle("dark", t === "dark");
    })();

    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            themed: "var(--text)",
            sub:    "var(--sub)",
            muted:  "var(--muted)",
            pos:    "var(--pos)",
            neg:    "var(--neg)",
            warn:   "var(--warn)",
            /* Dark mode surfaces — Selo-inspired */
            "dm-bg":      "#000000",
            "dm-surface": "#0A0A0A",
            "dm-card":    "#111111",
            "dm-border":  "#2A2A2A",
            "dm-muted":   "#7A7A7A",
            "dm-sub":     "#A3A3A3",
            "dm-text":    "#FFFFFF",
            /* Light mode surfaces — Selo-inspired (clean light mode) */
            "lm-bg":      "#FFFFFF",
            "lm-surface": "#F8F8F8",
            "lm-card":    "#F0F0F0",
            "lm-border":  "#E5E5E5",
            "lm-muted":   "#888888",
            "lm-sub":     "#666666",
            "lm-text":    "#171717",
            /* Accent — orange Selo style */
            accent:       "#F59E0B",
            "accent-inv": "#0A0A0A",
            positive:     "#10B981",
            negative:     "#EF4444",
            warning:      "#F59E0B",
            /* Selo-inspired orange */
            "selo-orange":    "#F59E0B",
            "selo-orange-500": "#F59E0B",
            "selo-orange-400": "#FBBF24",
            "selo-white":     "#FFFFFF",
            "selo-black":     "#000000",
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            body:    ["IBM Plex Sans", "sans-serif"],
            mono:    ["IBM Plex Mono", "monospace"],
          },
          borderRadius: {
            pill:  "9999px",
            panel: "16px",
            card:  "12px",
          },
        }
      }
    };
  </script>
  <style>
    /* ── CSS variables for dark/light theming ────────────────── */
    :root {
      --bg:      #FFFFFF;
      --surface: #F8F8F8;
      --card:    #F0F0F0;
      --border:  #E5E5E5;
      --text:    #171717;
      --sub:     #666666;
      --muted:   #888888;
      --accent:  #F59E0B;
      --pos:     #10B981;
      --neg:     #EF4444;
      --warn:    #F59E0B;
    }
    .dark {
      --bg:      #000000;
      --surface: #0A0A0A;
      --card:    #111111;
      --border:  #2A2A2A;
      --text:    #FFFFFF;
      --sub:     #A3A3A3;
      --muted:   #7A7A7A;
      --accent:  #F59E0B;
      --pos:     #10B981;
      --neg:     #EF4444;
      --warn:    #F59E0B;
    }

    /* ── Selo-inspired base styles ──────────────────────────── */
    html {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    input, select, textarea {
      background-color: var(--card);
      color: var(--text);
      border-color: var(--border);
    }
    input::placeholder, textarea::placeholder {
      color: var(--muted);
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Sans", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.2s, color 0.2s;
      /* Selo dot-grid background */
      background-image: radial-gradient(rgb(255 255 255 / 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Ensure dot grid works in both modes */
    .dark body {
      background-image: radial-gradient(rgb(255 255 255 / 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    body:not(.dark) {
      background-image: radial-gradient(rgb(0 0 0 / 0.08) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .font-display  { font-family: Manrope, sans-serif; }
    .font-mono-num { font-family: "IBM Plex Mono", monospace; }
    .tnum { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "zero" 1; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Theme-aware utility classes */
    .bg-themed        { background: var(--bg); }
    .surface-themed   { background: var(--surface); }
    .card-themed      { background: var(--card); }
    .border-themed    { border-color: var(--border); }
    .text-themed      { color: var(--text); }
    .text-sub         { color: var(--sub); }
    .text-muted       { color: var(--muted); }

    /* Selo edge effects */
    .edge {
      position: relative;
    }
    .edge::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: inherit;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      background: var(
        --edge,
        linear-gradient(135deg, rgb(255 255 255 / 0.2), rgb(255 255 255 / 0), rgb(255 255 255 / 0.1))
      );
      pointer-events: none;
    }
    .edge-bright {
      --edge: linear-gradient(
        135deg,
        rgb(255 255 255 / 0.2),
        rgb(255 255 255 / 0),
        rgb(255 255 255 / 0.2)
      );
    }
    .edge-pill {
      --edge: linear-gradient(
        180deg,
        rgb(255 255 255 / 0.2),
        rgb(255 255 255 / 0),
        rgb(255 255 255 / 0.1)
      );
    }
    .edge-soft {
      --edge: linear-gradient(
        135deg,
        rgb(255 255 255 / 0.1),
        rgb(255 255 255 / 0),
        rgb(255 255 255 / 0.1)
      );
    }
    .edge-faint {
      --edge: linear-gradient(
        135deg,
        rgb(255 255 255 / 0.1),
        rgb(255 255 255 / 0),
        rgb(255 255 255 / 0.05)
      );
    }

    /* Selo beam button */
    .selo-beam-link {
      position: relative;
      isolate: true;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      overflow: hidden;
      border-radius: 9999px;
      padding: 0.75rem 2rem;
      font-family: Manrope, sans-serif;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.125em;
      color: #fff;
      transition: all 0.5s;
      cursor: pointer;
    }
    .selo-beam-link:hover {
      transform: scale(1.02);
      box-shadow: 0 0 40px -10px rgba(245, 158, 11, 0.5);
    }
    .selo-beam-link .beam {
      animation: beam-spin 3s linear infinite;
    }
    @keyframes beam-spin {
      to { transform: rotate(360deg); }
    }

    /* Fade bottom patterns */
    .fade-bottom-90 {
      mask-image: linear-gradient(180deg, transparent, #000 0%, #000 90%, transparent);
    }

    /* Status pill badges — theme-aware */
    .badge-settled  { background:rgba(16,185,134,0.12);  border:1px solid rgba(16,185,134,0.3);  color:var(--pos); }
    .badge-anchored { background:rgba(255,255,255,0.06); border:1px solid var(--border);         color:var(--sub); }
    .badge-refused  { background:rgba(239,68,68,0.12);  border:1px solid rgba(239,68,68,0.3);   color:var(--neg); }
    .badge-held     { background:rgba(245,158,11,0.12);  border:1px solid rgba(245,158,11,0.3);  color:var(--warn); }
    .badge-pending  { background:rgba(122,122,122,0.12);border:1px solid var(--border);          color:var(--muted); }
    .dark .badge-anchored { background:rgba(255,255,255,0.06); }

    /* Header pill card */
    .pill-bar { background: var(--surface); border: 1px solid var(--border); }
    .dark .pill-bar { background: rgba(10,10,10,0.95); }

    /* Nav active state */
    .pill-nav-active { background: var(--card); color: var(--text); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* Positive / negative */
    .text-pos { color: var(--pos); }
    .text-neg { color: var(--neg); }

    /* Card hover */
    .card-hover { transition: border-color 0.15s, box-shadow 0.15s; }
    .card-hover:hover { border-color: var(--sub); box-shadow: 0 0 0 1px rgba(128,128,128,0.12); }

    /* Step cards */
    .step-card {
      transition: opacity 0.2s, transform 0.2s;
    }
    .step-card.done { opacity: 1; }
    .step-card.locked { opacity: 0.5; }

    /* Selo-style result badges */
    .result-pass { color: #10B981; }
    .result-fail { color: #EF4444; }
    .result-inconclusive { color: #F59E0B; }

    /* View display */
    .view { display: none; }
    .view.active { display: block; }
    #toast-stack { pointer-events: none; }
    #toast-stack > * { pointer-events: auto; }
    .safe-bottom { padding-bottom: max(0.375rem, env(safe-area-inset-bottom, 0px)); }
    .keyline     { border-left: 2px solid var(--sub); }
    .keyline-pos { border-left: 2px solid var(--pos); }

    /* Animations */
    @keyframes fade-slide-in {
      0% { opacity: 0; transform: translateY(30px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .enter { animation: fade-slide-in 1s ease-out both; }

    kbd { font-family: "IBM Plex Mono", monospace; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20; vertical-align: middle; }
    canvas { display: block; }
  </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="bg-themed text-themed antialiased min-h-screen">
  <div id="app">
    <!-- Loading fallback while app.js renders -->
    <div class="min-h-screen flex items-center justify-center bg-black text-white">
      <div class="text-center">
        <svg class="animate-spin h-8 w-8 border-2 border-white border-t-transparent rounded-full mx-auto mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <div class="font-mono text-xs text-gray-500">Booting Interminal</div>
      </div>
    </div>
  </div>

  <!-- Toast Stack -->
  <div id="toast-stack" class="fixed bottom-20 sm:bottom-4 right-2 sm:right-4 left-2 sm:left-auto z-[80] flex flex-col items-center sm:items-end gap-2"></div>

  <!-- Modal Root -->
  <div id="modal-root"></div>
</body>
<script src="./contractArtifact.js"></script>
<script src="./app.js"></script>
</html>
