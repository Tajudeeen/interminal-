<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://cdn.vercel-insights.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src https://fonts.gstatic.com; connect-src 'self' https://rpc.mainnet.arc.io https://api.dexscreener.com https://vitals.vercel-insights.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>INTERMINAL — Arc Trading Terminal</title>
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            paper:    "#0D111B",
            snow:     "#121622",
            mist:     "#1E2433",
            ink:      "#F1F5F9",
            smoke:    "#94A3B8",
            fog:      "#64748B",
            paid:     "#00E599",
            refused:  "#FF3B69",
            electric: "#0098F2",
            hold:     "#F59E0B",
            void:     "#08090C",
            "t1":     "#0D0F14",
            "t2":     "#12151D",
            "t3":     "#181C26",
            "line":   "#1F2430",
            "line-active": "#2B3447",
            cyan:     "#00F0FF",
            "cyan-dim": "#00DBE9",
            mint:     "#00E599",
            danger:   "#FF3B57",
            warn:     "#F59E0B",
            mute:     "#94A3B8",
          },
          fontFamily: {
            display: ["Manrope", "sans-serif"],
            body:    ["IBM Plex Sans", "sans-serif"],
            mono:    ["IBM Plex Mono", "monospace"],
          },
          borderRadius: {
            pill:  "9999px",
            panel: "16px",
            card:  "12px",
          },
          boxShadow: {
            invoice: "0 4px 32px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.04) inset",
          },
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; background: #0D111B; }
    body { font-family: "IBM Plex Sans", sans-serif; overscroll-behavior: none; }
    .font-display  { font-family: Manrope, sans-serif; }
    .font-mono-num { font-family: "IBM Plex Mono", monospace; }
    .tnum { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: "tnum" 1, "zero" 1; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #1E2433; border-radius: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .glow-paid    { box-shadow: 0 0 10px 2px rgba(0,229,153,0.18); }
    .glow-electric{ box-shadow: 0 0 10px 2px rgba(0,152,242,0.18); }
    .glow-refused { box-shadow: 0 0 10px 2px rgba(255,59,105,0.18); }
    .badge-settled  { background:rgba(0,229,153,0.12); border:1px solid rgba(0,229,153,0.25); color:#00E599; }
    .badge-anchored { background:rgba(0,152,242,0.12); border:1px solid rgba(0,152,242,0.25); color:#0098F2; }
    .badge-refused  { background:rgba(255,59,105,0.12); border:1px solid rgba(255,59,105,0.25); color:#FF3B69; }
    .badge-held     { background:rgba(245,158,11,0.12); border:1px solid rgba(245,158,11,0.25); color:#F59E0B; }
    .badge-pending  { background:rgba(100,116,139,0.12); border:1px solid rgba(100,116,139,0.25); color:#94A3B8; }
    .keyline     { border-left: 2px solid #00F0FF; }
    .keyline-paid{ border-left: 2px solid #00E599; }
    kbd { font-family: "IBM Plex Mono", monospace; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20; vertical-align: middle; }
    canvas { display: block; }
    .view { display: none; }
    .view.active { display: block; }
    #toast-stack { pointer-events: none; }
    #toast-stack > * { pointer-events: auto; }
    .safe-bottom { padding-bottom: max(0.375rem, env(safe-area-inset-bottom, 0px)); }
    .pill-nav-active { background:#1E2433; color:#F1F5F9; }
    .card-hover { transition: border-color 0.15s, box-shadow 0.15s; }
    .card-hover:hover { border-color: rgba(0,152,242,0.35); box-shadow: 0 0 0 1px rgba(0,152,242,0.12); }
  </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body class="bg-paper text-ink antialiased min-h-screen">
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-stack" class="fixed bottom-16 sm:bottom-4 right-2 sm:right-4 left-2 sm:left-auto z-[80] flex flex-col items-center sm:items-end gap-2"></div>
  <script src="./contractArtifact.js"></script>
  <script src="./app.js"></script>
</body>
</html>
