name: Interminal verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Protocol and legacy regression suite
        run: npm run test:legacy

      - name: GeckoTerminal Arc market-data verification
        run: npm run verify:market

      - name: Arc mainnet verification
        run: npm run verify:arc
