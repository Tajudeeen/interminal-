name: Interminal verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Protocol and legacy regression suite
        run: npm run test:legacy

      - name: GeckoTerminal Arc market-data verification
        run: npm run verify:market

      - name: Arc mainnet verification
        run: npm run verify:arc

      - name: Verify committed payment evidence when present
        run: |
          if [ -f artifacts/payment-submission-evidence.json ]; then
            npm run verify:submission
          else
            echo "::notice::Software checks only. Submission proof is checked by the separate required readiness job."
          fi

  submission-ready:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require a real independently verified payment
        run: npm run check:submission
